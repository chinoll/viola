[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viola-fp8-muon"
version = "0.1.0"
description = "Explicit FP8 Muon plugin for DeepSpeed ZeRO-1 and ZeRO-2"
requires-python = ">=3.10"
dependencies = ["torch>=2.11", "deepspeed==0.19.7", "tilelang==0.1.15"]

[tool.setuptools.packages.find]
include = ["viola*"]
